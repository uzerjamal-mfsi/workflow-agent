[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-web-starter"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "gunicorn>=26.2.0",
    "uvicorn>=0.54.0",
    "langchain-classic>=1.0.8",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.18",
    "langsmith>=0.14.16",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.7",
]

[project.scripts]
ingest-sops = "app.scripts.ingest_sops:main"

[project.optional-dependencies]
dev = [
    "commitizen>=4.19.3",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app"]
extend-exclude = ["temp", "website"]

[tool.ruff.lint]
# Ruff replaces Black + isort: E/F are the defaults, I sorts imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
# Allowed types for Conventional Commits
# feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["temp*"]
