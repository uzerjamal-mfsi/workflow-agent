[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-web-starter"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "gunicorn>=26.2.0",
    "uvicorn>=0.54.0",
    "langchain-classic>=1.0.8",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.18",
    "langsmith>=0.14.13",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.isort]
profile = "black"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
# Allowed types for Conventional Commits
# feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["temp*"]
