services:
  app:
    build: .
    container_name: agentic_web_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use a stable container path, but persist to the host WORKING_DIR.
      - WORKING_DIR=/workdir
      - GUNICORN_WORKERS=4
      - PYTHONWARNINGS=ignore
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/workflow_agent
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    command: >
      sh -c "gunicorn app.main:app --preload -w $${GUNICORN_WORKERS:-4} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    volumes:
      # Persist logs and model data under your host WORKING_DIR.
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  tests:
    build:
      context: .
      target: builder
    container_name: agentic_web_tests
    command: >
      sh -c "pip install --no-cache-dir '.[dev]' -q && pytest -q app/tests"
    env_file:
      - .env
    environment:
      - WORKING_DIR=/workdir
      - PYTHONWARNINGS=ignore
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/workflow_agent
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: workflow_agent_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=workflow_agent
    ports:
      - "5432:5432"
    volumes:
      - ${WORKING_DIR:-./temp}/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    environment:
      - QDRANT__LOG_LEVEL=WARN
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Keep qdrant storage under the same host WORKING_DIR.
      - ${WORKING_DIR:-./temp}/qdrant_storage:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
