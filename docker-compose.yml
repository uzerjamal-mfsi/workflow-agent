services:
  app:
    build: .
    container_name: agentic_web_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use a stable container path, but persist to the host WORKING_DIR.
      - WORKING_DIR=/workdir
      - GUNICORN_WORKERS=4
      - PYTHONWARNINGS=ignore
    command: >
      sh -c "gunicorn app.main:app --preload -w $${GUNICORN_WORKERS:-4} -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    volumes:
      # Persist logs and model data under your host WORKING_DIR.
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      - qdrant

  tests:
    build:
      context: .
      target: builder
    container_name: agentic_web_tests
    command: >
      sh -c "pip install --no-cache-dir '.[dev]' -q && pytest -q app/tests"
    env_file:
      - .env
    environment:
      - WORKING_DIR=/workdir
      - PYTHONWARNINGS=ignore
    volumes:
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    environment:
      - QDRANT__LOG_LEVEL=WARN
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Keep qdrant storage under the same host WORKING_DIR.
      - ${WORKING_DIR:-./temp}/qdrant_storage:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
