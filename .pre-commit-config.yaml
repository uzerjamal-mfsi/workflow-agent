# Install once per clone: pre-commit install
# (default_install_hook_types registers the pre-commit, commit-msg and pre-push hooks.)
# Run manually on all files: pre-commit run --all-files
# https://pre-commit.com
#
# Conventional Commits enforcement (commit-msg stage) uses commitizen.
# Format: <type>(<scope>): <subject>
# Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Single linter + formatter. Keep `rev` in sync with the ruff floor in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^app/
      - id: ruff-format
        files: ^app/

  # Secret scanning. The docker hook avoids requiring a Go toolchain on Windows.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-docker

  - repo: local
    hooks:
      - id: mypy
        name: mypy (pre-push)
        language: system
        entry: uv run mypy app/
        pass_filenames: false
        files: ^app/
        stages: [pre-push]

      - id: pytest
        name: pytest (pre-push)
        language: system
        entry: uv run pytest -q app/tests
        pass_filenames: false
        files: ^(app/|pyproject\.toml$)
        stages: [pre-push]
